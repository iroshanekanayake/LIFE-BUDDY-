<html lang="si">
<head>
<meta charset="utf-8">

<title>LIFE-BUDDY</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500&display=swap">
<style>
:root{--bg:#F4F8F5;--card:#fff;--ink:#14241B;--mut:#5C6F64;--line:#D8E3DB;--pri:#1F5A40;--onpri:#fff;--inc:#237A4B;--incbg:#E2F3E8;--exp:#B8402A;--expbg:#FBE7E2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1914;--card:#17251D;--ink:#E7F0EA;--mut:#9DB2A5;--line:#27392E;--pri:#4DB383;--onpri:#08140E;--inc:#6BD39A;--incbg:#17382A;--exp:#F08A74;--expbg:#3A1F19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1914;--card:#17251D;--ink:#E7F0EA;--mut:#9DB2A5;--line:#27392E;--pri:#4DB383;--onpri:#08140E;--inc:#6BD39A;--incbg:#17382A;--exp:#F08A74;--expbg:#3A1F19;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans Sinhala",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:22px;font-weight:500;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri);width:100%;font-weight:500}
.tabs,.two,.row2{display:flex;gap:8px}
.tabs button{flex:1;padding:6px}
.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.lab{color:var(--mut);font-size:14px}
.big{font-size:34px;font-weight:500;line-height:1.3;margin-bottom:10px}
.pill{flex:1;border-radius:10px;padding:8px 12px;font-size:14px}
.pill b{display:block;font-size:18px;font-weight:500}
.inc{background:var(--incbg);color:var(--inc)}
.exp{background:var(--expbg);color:var(--exp)}
.item{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:10px 2px}
.item small{display:block;color:var(--mut);font-size:13px}
.amt{font-weight:500;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:28px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chips button{padding:6px 14px;min-height:40px}
.err{color:var(--exp);font-size:14px;min-height:22px}
.gap{margin-top:12px}
h2{font-size:18px;font-weight:500;margin:0}
#app{padding-bottom:96px}
.av{width:40px;height:40px;border-radius:50%;color:#fff;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0;border:0;font-size:18px}
.avc{width:56px;height:56px;font-size:24px;flex:none}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#nav[hidden]{display:none}
#nav button{flex:1;max-width:100px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:12px;color:var(--mut);min-height:48px;border-radius:8px}
#nav button.cur{color:var(--pri);font-weight:500}
#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#back3,#back4,#back5{display:none}
:root{--pri2:#2F7D59;--sh:rgba(0,0,0,.28);--hi:rgba(255,255,255,.9);--lo:rgba(0,0,0,.09)}
:root[data-skin="ocean"]{--bg:#EEF5FB;--card:#fff;--ink:#12263A;--mut:#55697D;--line:#D3E1EE;--pri:#1D5FA8;--pri2:#3A82CF;--onpri:#fff;--inc:#1F7A52;--incbg:#DFF2E8;--exp:#B8402A;--expbg:#FBE7E2}
:root[data-skin="sunset"]{--bg:#FFF4EC;--card:#fff;--ink:#3A1D10;--mut:#7D6355;--line:#F0DACB;--pri:#C4551B;--pri2:#E57A3C;--onpri:#fff;--inc:#2E7D4F;--incbg:#E2F3E8;--exp:#B3263A;--expbg:#FCE4E8}
:root[data-skin="royal"]{--bg:#F5F1FB;--card:#fff;--ink:#231638;--mut:#6A5C80;--line:#E2D9F0;--pri:#6B3FB3;--pri2:#8A5FD1;--onpri:#fff;--inc:#247A52;--incbg:#E0F2E8;--exp:#B8402A;--expbg:#FBE7E2}
:root[data-skin="night"]{--bg:#0E1511;--card:#17231B;--ink:#E7F0EA;--mut:#9DB2A5;--line:#27392E;--pri:#4DB383;--pri2:#6FD0A2;--onpri:#08140E;--inc:#6BD39A;--incbg:#17382A;--exp:#F08A74;--expbg:#3A1F19;--sh:rgba(0,0,0,.7);--hi:rgba(255,255,255,.12);--lo:rgba(0,0,0,.4);color-scheme:dark}
button{border:0;border-radius:18px;background:linear-gradient(180deg,var(--card),var(--bg));box-shadow:0 7px 12px -6px var(--sh),inset 0 2px 2px var(--hi),inset 0 -3px 5px var(--lo);transition:transform .12s,box-shadow .12s}
button:active{transform:translateY(2px) scale(.97);box-shadow:0 2px 4px -2px var(--sh),inset 0 3px 6px var(--lo)}
.pri,.on{background:linear-gradient(180deg,var(--pri2),var(--pri));color:var(--onpri)}
.item,.item:active{box-shadow:none;background:none;border-radius:0;transform:none}
#nav button{box-shadow:none;background:none}
#nav button.cur{background:linear-gradient(180deg,var(--card),var(--bg));box-shadow:0 6px 10px -6px var(--sh),inset 0 2px 2px var(--hi),inset 0 -3px 5px var(--lo)}
.sum{border-radius:20px;box-shadow:0 12px 20px -12px var(--sh),inset 0 2px 2px var(--hi)}
input{border-radius:14px;box-shadow:inset 0 2px 5px var(--lo)}
.sel{outline:3px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
.ed{text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
#bpane>*+*,#lpane>*+*{margin-top:12px}
#wp,#wpo{position:fixed;inset:0;z-index:-1;display:none}
html.wp #wp,html.wp #wpo{display:block}
#wp{z-index:-2}
#wpo{background:var(--bg)}
html.wp body{background:transparent}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
section>*+*{margin-top:12px}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;width:100%;margin-top:12px}

/* LIFE-BUDDY Cloud account gate */
#cloudGate{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
#cloudGate[hidden]{display:none}
#cloudCard{width:min(100%,430px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 40px #0002}
#cloudCard h2{margin:0 0 6px;font-size:21px}#cloudCard p{margin:5px 0 12px;color:var(--mut);font-size:12px;line-height:1.5}
#cloudCard input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:5px 0;font-size:14px;line-height:1.35}
#cloudCard button{width:100%;padding:11px 12px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);margin:5px 0;font-weight:600;font-size:14px;line-height:1.35}
#cloudCard button.secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#cloudStatus{font-size:12px;color:var(--mut);min-height:20px;white-space:pre-wrap}
#cloudBoot{position:fixed;inset:0;z-index:100000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:var(--mut);font-size:14px}
#cloudBoot[hidden]{display:none}
#cloudUserBar{display:none;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0 16px;font-size:13px;align-items:center;gap:9px;flex-wrap:wrap}
#cloudUserBar button{padding:8px 12px;font-size:13px;width:auto;margin:0;white-space:nowrap}
#cloudAccountTitle{font-weight:650;margin-bottom:8px}
#cloudAccountEmail{overflow-wrap:anywhere;min-width:0}
#cloudAccountMeta{font-size:12px;color:var(--mut);margin-top:4px}
@media(max-width:380px){#cloudCard{padding:18px}#cloudCard button{font-size:13px}#cloudCard input{font-size:13px}}
</style>

    try{say('අලුත් ගිණුම සාදමින්…');await auth.createUserWithEmailAndPassword(c.email,c.pass)}
    catch(e){say(friendly(e))}
  }
  function friendly(e){var c=e&&e.code;return ({'auth/email-already-in-use':'මෙම Email එක දැනටමත් භාවිතා වේ. Login කරන්න.','auth/weak-password':'වඩා ශක්තිමත් Password එකක් භාවිතා කරන්න.','auth/invalid-email':'Email ලිපිනය නිවැරදි නැහැ.','auth/too-many-requests':'උත්සාහයන් වැඩියි. පසුව නැවත උත්සාහ කරන්න.','auth/operation-not-allowed':'Firebase Console තුළ මෙම Login ක්‍රමය සක්‍රිය කරන්න.','auth/unauthorized-domain':'Firebase Authentication → Authorized domains තුළ GitHub Pages domain එක එක් කරන්න.','auth/popup-blocked':'Google Login popup එක Browser එකෙන් අවහිර කළා. Chrome තුළ නැවත උත්සාහ කරන්න.','auth/popup-closed-by-user':'Google Login කවුළුව වසා ඇත. නැවත උත්සාහ කරන්න.','auth/cancelled-popup-request':'Google Login ඉල්ලීමක් දැනටමත් ක්‍රියාත්මකයි. මොහොතක් ඉඳලා නැවත උත්සාහ කරන්න.','auth/operation-not-supported-in-this-environment':'මෙම පරිසරයේ Google Popup Login සහාය නොදක්වයි. සාමාන්‍ය Chrome Browser එකෙන් විවෘත කරන්න.','permission-denied':'Firestore Rules පරීක්ෂා කරන්න.'})[c]||((e&&e.message)||'සම්බන්ධ වීම අසාර්ථකයි. නැවත උත්සාහ කරන්න.')}
  document.getElementById('cloudEmailLogin').onclick=emailLogin;
  document.getElementById('cloudEmailSignup').onclick=emailSignup;
  document.getElementById('cloudGoogle').onclick=async function(){
    var button=this;
    button.disabled=true;
    say('Google හරහා Login වෙමින්…');
    try{
      var provider=new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt:'select_account'});
      // GitHub Pages is a third-party hosting domain. Firebase redirect sign-in can
      // fail in modern browsers when cross-site storage is restricted. Use popup
      // sign-in, which Firebase documents as an alternative for this hosting setup.
      await auth.signInWithPopup(provider);
    }catch(e){
      console.error('LIFE-BUDDY Google sign-in failed:',e);
      say(friendly(e));
    }finally{
      button.disabled=false;
    }
  };
  document.getElementById('cloudOffline').onclick=setOffline;
  document.getElementById('cloudSignOut').onclick=async function(){
    if(!window.confirm('ඔබට LIFE-BUDDY ගිණුමෙන් Sign out වීමට අවශ්‍යද?'))return;
    try{
      if(unsub){unsub();unsub=null}clearTimeout(timer);
      if(offline){offline=false;currentUser=null;ready=false;userBar.style.display='none';showGate(true);return}
      await auth.signOut();
    }catch(e){syncLabel(friendly(e))}
  };
  if(!configured||!window.firebase){say('Firebase setup තවම සම්පූර්ණ නැහැ. firebase-config.js ගොනුවේ Firebase Web App config ඇතුළත් කරන්න.');document.getElementById('cloudGoogle').disabled=true;document.getElementById('cloudEmailLogin').disabled=true;document.getElementById('cloudEmailSignup').disabled=true;showGate(true);finishBoot();hookSave();return}
  try{
    firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
    // Explicitly retain the Firebase session across PWA/browser restarts.
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function(){
      auth.onAuthStateChanged(async function(user){
        if(!user){
          if(!offline){currentUser=null;ready=false;if(unsub){unsub();unsub=null}userBar.style.display='none';showGate(true)}
          finishBoot();return;
        }
        offline=false;setSignedIn(user);
        try{await loadCloud(user);showGate(false)}
        catch(e){console.error(e);applyingRemote=false;ready=false;syncLabel('Cloud sync error — '+friendly(e));showGate(false)}
        finally{finishBoot()}
      });
    }).catch(function(e){console.error('Firebase persistence setup failed:',e);say(friendly(e));showGate(true);finishBoot()});
    auth.getRedirectResult().catch(function(e){say(friendly(e))});
    hookSave();
  }catch(e){console.error(e);say('Firebase config එක නිවැරදි නැහැ: '+friendly(e));showGate(true);finishBoot()}
})();
</script>
